<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JOEL XMD STORE</title>

<style>
*{
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    margin:0;
    background:#0b0b0f;
    color:white;
}

header{
    padding:20px;
    text-align:center;
    background:#111827;
}

h1{
    color:#00eaff;
}

.search{
    width:90%;
    max-width:600px;
    padding:15px;
    border-radius:30px;
    border:none;
    outline:none;
    font-size:16px;
}

.container{
    padding:20px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.card{
    background:#161b22;
    border-radius:20px;
    padding:15px;
    box-shadow:0 0 15px #000;
}

.card img{
    width:80px;
    height:80px;
    border-radius:20px;
    object-fit:cover;
}

.title{
    font-size:20px;
    font-weight:bold;
    margin-top:10px;
}

.info{
    color:#aaa;
    margin:5px 0;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:20px;
    background:#00eaff;
    color:#000;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#00bcd4;
}

.loading{
    text-align:center;
    padding:30px;
}
</style>

</head>

<body>

<header>

<h1>🚀 JOEL XMD STORE</h1>

<input 
class="search"
id="search"
placeholder="Search apps..."
>

</header>


<div class="loading" id="loading">
Loading apps...
</div>


<div class="container" id="apps"></div>



<script>

const API =
"https://api.qasimdev.dpdns.org/api/getmod/search";


const KEY =
"qasim-dev";


const appsBox =
document.getElementById("apps");


const loading =
document.getElementById("loading");


const search =
document.getElementById("search");



async function fetchApps(query="example"){

try{

loading.style.display="block";

appsBox.innerHTML="";


let response =
await fetch(
`${API}?query=${encodeURIComponent(query)}&apiKey=${KEY}`
);


let data =
await response.json();



if(!data.success){
throw "No apps found";
}



loading.style.display="none";


displayApps(data.data.apps);



}catch(error){

loading.innerHTML =
"Failed loading apps";

console.log(error);

}

}




function displayApps(apps){


appsBox.innerHTML="";


apps.forEach(app=>{


let card =
document.createElement("div");


card.className="card";


card.innerHTML=`

<img src="${app.icon}"
onerror="this.src='https://via.placeholder.com/100'">


<div class="title">
${app.title}
</div>


<div class="info">
📂 ${app.category}
</div>


<div class="info">
📦 ${app.size}
</div>


<div class="info">
⚡ ${app.version}
</div>


<div class="info">
⭐ ${app.modInfo}
</div>


<a href="${app.downloadUrl}" target="_blank">

<button>
Download
</button>

</a>


`;



appsBox.appendChild(card);


});


}





search.addEventListener(
"keyup",
()=>{


let value =
search.value.trim();


if(value.length>2){

fetchApps(value);

}


});



// initial apps

fetchApps("whatsapp");


</script>


</body>
</html>
